name: PR Validation

on:
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Lint and format check
      run: |
        npm run lint
        npm run format:check
    
    - name: Check architecture
      run: npm run check:architecture
    
    - name: Run tests with coverage
      run: npm run test:coverage
      id: coverage
    
    - name: Run backtests
      run: npm test
      continue-on-error: true
    
    - name: Comment PR with coverage report
      uses: marocchino/sticky-pull-request-comment@v2
      with:
        recreate: true
        message: |
          ## Coverage Report
          
          ### Summary
          - Total Coverage: ${{ steps.coverage.outputs.coverage }}%
          - Files Covered: ${{ steps.coverage.outputs.files }}
          
          ### Details
          <details>
          <summary>Expand for full coverage report</summary>
          
          ```
          ${{ steps.coverage.outputs.report }}
          ```
          
          </details>
          
          [View full report in artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
